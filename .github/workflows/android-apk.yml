name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify merge integrity
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .github app/src; then
            echo "Unresolved merge marker detected." >&2
            exit 1
          fi
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Test, lint, and build debug APK
        run: |
          mkdir -p app/build/reports/ci-logs
          set -o pipefail
          gradle --no-daemon --build-cache --parallel \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            --stacktrace --console=plain 2>&1 | tee app/build/reports/ci-logs/quality-and-build.log

      - name: Create APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: novel-library-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged temporary APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novel-library-quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novel-library-ci-logs
          path: app/build/reports/ci-logs/
          if-no-files-found: warn
          retention-days: 14

  device-tests:
    name: Emulator integration and 10k performance tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: debug-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set +e
            gradle --no-daemon :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.notClass=com.personal.novellibrary.PlatformLiveSmokeTest
            status=$?
            if [ "$status" -eq 0 ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              gradle --no-daemon :app:connectedDebugAndroidTest \
                -Pandroid.testInstrumentationRunnerArguments.class=com.personal.novellibrary.PlatformLiveSmokeTest
              status=$?
            fi
            mkdir -p app/build/reports/device-baseline
            adb logcat -d -s NovelLibraryPerf:I NovelLibraryPlatform:I '*:S' > app/build/reports/device-baseline/results.log
            exit $status
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novel-library-device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/reports/device-baseline/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
